<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="main.css">
    <script type="module">
        import run from "./script.js";
        run();
    </script>
</head>
<body>
<div class="flex-container">
    <div class="flex-item-1"></div>
    <div class="flex-item-2"></div>
    <div class="flex-item-3"><a href="/login" class="btn">Login</a>
    </div>
</div>
<div class="container">
    <aside class="sidebar">
        <img class="logo" src="https://images.squarespace-cdn.com/content/v1/6761621cb73789168906a9aa/828f8489-e0ed-49cb-8c39-02c3e21db33a/FLC+Logo+white.png?format=1500w">
        <h3>Filtre</h3>
        <div class="filter-group">
            <label for="region">Region</label>
            <select id="region">
                <option>Alle</option>
                <option>Europa</option>
                <option>Sydamerika</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="league">Liga</label>
            <select id="league">
                <option>Alle</option>
                <option>Pro League</option>
                <option>Beach Series</option>
            </select>
        </div>
    </aside>
    <main class="main">
        <div class="topbar">
            <h2>Live Scores - Footvolley</h2>
            <select id="daySelector">
                <option>I dag</option>
                <option>I morgen</option>
            </select>
        </div>

        <div id="matches">
            <!-- Dummy match -->
            <div class="match-card">
                <div>
                    <div><strong>Team A</strong> vs <strong>Team B</strong></div> <br>
                    <div class="time">14:00</div>
                </div>
                <div class="status">LIVE</div>
            </div>

            <div class="match-card">
                <div>
                    <div><strong>Team C</strong> vs <strong>Team D</strong></div> <br>
                    <div class="time">12:00</div>
                </div>
                <div class="status FT">UPCOMING</div>
            </div>
        </div>
    </main>
</div>

<footer>
    <p>All tournaments are facilitated by local clubs with the help and support from Bolao Sports. </p>
    <p></p>
    <p><a href="mailto:office@bolao-sports.com">office@bolao-sports.com</a></p>
</footer>
</body>
</html>
