<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin home page</title>
    <link rel="stylesheet" href="../../main.css">
    <script type="module">
        import run from "./script.js";
        run();
    </script>
</head>
<body>
<div class="flex-container">
    <div class="flex-item-1"></div>
    <div class="flex-item-2"></div>
    <div class="flex-item-3"><button class="btn" type="button" id="logout"></button>
    </div>
</div>

<h1 style="color: black; align-self: center;">Welcome to your profile, Admin!</h1>

<div class="create-container">
<h1>Create club</h1>
<form id="createClub">
    <label>Contact email: <input type="email" id="email" required></label>
    <label>Contact first name: <input type="text" id="firstName" required></label>
    <label>Contact last name: <input type="text" id="lastName" required></label>
    <label>Club name: <input type="text" id="clubName" required></label>
    <label>Established: <select><option>2025</option></select></label>
    <label>Country: <select><option>Denmark</option></select></label>
    <label>City: <input type="text" id="city" required></label>
    <label>New password: <input type="password" id="password1" required></label>
    <label>Repeat password: <input type="password" id="password2" required></label>
    <p id="error-message"></p>
    <p id="message" style="color: green"></p>
    <button class="btn" type="submit">Create new login</button>
</form>
</div>
<br>

<div class="create-container">
    <h1>Create tournament</h1>
    <form id="createTournament">
        <label>City of tournament: <input type="text" id="city" required placeholder="Barcelona"></label> <br>
        <label>Full address: <input type="text" id="location" required placeholder="Paseo Maritimo Barceloneta, 14, Barcelona, ES 08003"></label><br>
        <label>Points at stake: <input type="number" id="pointsAtStake" required placeholder="10"></label><br>
        <label>Qualification start date: <input type="date" id="qualificationStartDate" required placeholder="password123"></label><br>
        <label>Qualification end date: <input type="date" id="qualificationEndDate" required placeholder="password123"></label><br>
        <label>Finals start date: <input type="date" id="finalsStartDate" required placeholder="password123"></label><br>
        <label>Finals end date: <input type="date" id="finalsEndDate" required placeholder="password123"></label><br>
        <label>Partners: <input type="text" id="partners" required placeholder="Bolao"></label><br>
        <label>Price in the lowest monetary unit (ex. cents for Euros):<input type="number" id="prizeMoney" required placeholder="10"></label><br>
        <label>Currency: <input type="text" id="currency" required placeholder="Euros"></label><br>

        <p id="message2" style="color: green"></p>
        <button class="btn" type="submit">Create new tournament</button>
    </form>
</div>

<div class="create-container">
    <h1>Create partner</h1>
    <form id="createPartner">
        <label>Name: <input type="text" id="name" required placeholder="Bolao"></label> <br>
        <label>Logo URL: <input type="text" id="logoBlobUrl" required placeholder="https://images.squarespace-cdn.com/content/v1/6761621cb73789168906a9aa/828f8489-e0ed-49cb-8c39-02c3e21db33a/FLC+Logo+white.png?format=1500w"></label><br>

        <p id="message3" style="color: green"></p>
        <button class="btn" type="submit">Create new partner</button>
    </form>
</div>


</body>
</html>
