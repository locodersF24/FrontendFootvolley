<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin home page</title>
    <link rel="stylesheet" href="../../main.css">
    <script type="module">
        import run from "./script.js";
        run();
    </script>
</head>
<body>
<div class="flex-container">
    <div class="flex-item-1"></div>
    <div class="flex-item-2"></div>
    <div class="flex-item-3"><button class="btn" type="button" id="logout"></button>
    </div>
</div>

<h1 style="color: black; align-self: center;">Welcome to your profile, Admin!</h1>

<div class="create-container">
<h1>Create club</h1>
<form id="createClub">
    <label>New club email: <input type="email" id="email" required placeholder="cph@footvolley.dk"></label> <br>
    <label>Contact first name: <input type="text" id="firstName" required placeholder="Tobias"></label><br>
    <label>Contact last name: <input type="text" id="lastName" required placeholder="Barbosa"></label><br>
    <label>New password: <input type="password" id="password1" required placeholder="password123"></label><br>
    <label>Repeat password: <input type="password" id="password2" required placeholder="password123"></label><br>
    <p id="error-message"></p>
    <p id="message" style="color: green"></p>
    <button type="submit">Create new login</button>
</form>
</div>

</body>
</html>
